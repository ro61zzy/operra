version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: operra-postgres
    restart: always
    environment:
      POSTGRES_USER: operra
      POSTGRES_PASSWORD: operra_password
      POSTGRES_DB: operra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: